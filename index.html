<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobiFree - Pro Media Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%); color: #f1f5f9; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .inner-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
    .inner-box:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
    select, input[type="text"] { background-color: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
    select:focus, input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    .btn-gradient-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
    .btn-gradient-primary:hover { box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
    .btn-gradient-secondary { background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%); transition: all 0.3s ease; }
    .btn-gradient-secondary:hover { box-shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.4); transform: translateY(-1px); }
    .spin-fast { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="w-full border-b border-white/5 bg-[#0b0f19]/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-cloud-arrow-down text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg sm:text-xl tracking-tight text-white leading-none">GlobiFree<span class="text-indigo-400">.Pro</span></h1>
          <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest font-semibold">Live Streaming Engine</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 py-10 flex-grow flex flex-col items-center justify-center">
    <div class="text-center mb-8">
      <h2 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 tracking-tight mb-3">
        Zero Wait. Instant Downloads.
      </h2>
      <p class="text-sm sm:text-base text-slate-400 max-w-xl mx-auto">
        Paste your link and watch the download start immediately in your browser.
      </p>
    </div>

    <div class="glass-card rounded-2xl w-full p-6 sm:p-8 space-y-6">
      <!-- Input Area -->
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-grow flex items-center group">
          <i class="fa-solid fa-link absolute left-4 text-slate-500 text-sm group-focus-within:text-indigo-400"></i>
          <input type="text" id="mediaUrlInput" placeholder="Paste YouTube or Instagram link here..." class="w-full pl-12 pr-20 py-4 rounded-xl text-sm transition-all" />
          <button type="button" id="pasteBtn" class="absolute right-3 px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold">Paste</button>
        </div>
        <button type="button" id="fetchDetailsBtn" onclick="fetchMediaDetails()" class="btn-gradient-primary px-8 py-4 rounded-xl text-white font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-bolt"></i><span>Fetch</span>
        </button>
      </div>

      <!-- Preview Card -->
      <div id="mediaPreviewCard" class="hidden inner-box rounded-xl p-4 flex flex-col sm:flex-row items-center gap-5">
        <div class="relative rounded-lg overflow-hidden border border-white/10 shrink-0 w-full sm:w-48 h-28 bg-black/50">
           <img id="previewThumbnail" src="" class="w-full h-full object-cover" />
           <div class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded"><span id="previewDuration"></span></div>
        </div>
        <div class="flex-grow w-full text-center sm:text-left">
          <div class="flex justify-center sm:justify-start gap-2 mb-2">
            <span id="previewPlatformTag" class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">YOUTUBE</span>
          </div>
          <h3 id="previewTitle" class="text-sm sm:text-base font-bold text-white truncate w-full">Media Title</h3>
        </div>
      </div>

      <!-- Controls -->
      <div id="controlsContainer" class="hidden space-y-4">
          <!-- Video -->
          <div class="inner-box rounded-xl p-5">
            <div class="text-xs font-bold uppercase text-indigo-400 mb-4"><i class="fa-solid fa-video mr-2"></i>Video Download</div>
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
              <div class="sm:col-span-5"><input type="text" id="videoFileName" class="w-full px-4 py-3 rounded-xl text-xs" /></div>
              <div class="sm:col-span-2"><select id="videoFormatSelect" class="w-full px-3 py-3 rounded-xl text-xs"><option value="mp4">MP4</option></select></div>
              <div class="sm:col-span-2">
                <select id="videoQualitySelect" class="w-full px-3 py-3 rounded-xl text-xs">
                  <option value="720" selected>720p HD</option>
                  <option value="480">480p</option>
                  <option value="360">360p</option>
                </select>
              </div>
              <div class="sm:col-span-3">
                <button type="button" id="downloadVideoBtn" onclick="triggerDownload('video')" class="btn-gradient-primary w-full py-3 rounded-xl text-white font-bold text-sm">
                  <i class="fa-solid fa-download mr-1"></i> Download
                </button>
              </div>
            </div>
          </div>

          <!-- Audio -->
          <div class="inner-box rounded-xl p-5">
            <div class="text-xs font-bold uppercase text-pink-400 mb-4"><i class="fa-solid fa-music mr-2"></i>Audio Download</div>
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
              <div class="sm:col-span-5"><input type="text" id="audioFileName" class="w-full px-4 py-3 rounded-xl text-xs" /></div>
              <div class="sm:col-span-2"><select id="audioFormatSelect" class="w-full px-3 py-3 rounded-xl text-xs"><option value="mp3">MP3</option></select></div>
              <div class="sm:col-span-2"><select id="audioQualitySelect" class="w-full px-3 py-3 rounded-xl text-xs"><option value="320">320k</option><option value="128">128k</option></select></div>
              <div class="sm:col-span-3">
                <button type="button" id="downloadAudioBtn" onclick="triggerDownload('audio')" class="btn-gradient-secondary w-full py-3 rounded-xl text-white font-bold text-sm">
                  <i class="fa-solid fa-headphones mr-1"></i> Download
                </button>
              </div>
            </div>
          </div>
      </div>

      <div id="alertBox" class="hidden rounded-xl p-4 text-xs font-semibold border text-center"></div>
    </div>
  </main>

  <footer class="w-full py-6 text-center text-[11px] font-semibold text-slate-500 uppercase tracking-widest border-t border-white/5">
    &copy; 2026 GlobiFree Pro — Instant Engine
  </footer>

  <script>
    const API_BASE = '';
    const mediaUrlInput = document.getElementById('mediaUrlInput');
    const alertBox = document.getElementById('alertBox');

    document.getElementById('pasteBtn').addEventListener('click', async () => {
      try { mediaUrlInput.value = (await navigator.clipboard.readText()).trim(); fetchMediaDetails(); } 
      catch (e) { showAlert('Clipboard access denied.', true); }
    });

    function showAlert(msg, isError) {
      alertBox.className = `rounded-xl p-4 text-xs font-semibold border text-center ${isError ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`;
      alertBox.innerHTML = msg;
      alertBox.classList.remove('hidden');
      if (!isError) setTimeout(() => alertBox.classList.add('hidden'), 4000);
    }

    async function fetchMediaDetails() {
      const url = mediaUrlInput.value.trim();
      if (!url) return;
      document.getElementById('fetchDetailsBtn').innerHTML = '<i class="fa-solid fa-circle-notch spin-fast"></i> Fetching...';
      
      try {
        let res = await fetch(`${API_BASE}/api/info`, { method: 'POST', body: new URLSearchParams({url}) });
        if (!res.ok) res = await fetch(`${API_BASE}/api/info?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        
        document.getElementById('previewThumbnail').src = data.thumbnail || '';
        document.getElementById('previewPlatformTag').textContent = data.platform || 'MEDIA';
        document.getElementById('previewDuration').textContent = data.duration_string || '';
        document.getElementById('previewTitle').textContent = data.title || 'Media';
        document.getElementById('videoFileName').value = data.title || '';
        document.getElementById('audioFileName').value = data.title || '';
        
        document.getElementById('mediaPreviewCard').classList.remove('hidden');
        document.getElementById('controlsContainer').classList.remove('hidden');
        alertBox.classList.add('hidden');
      } catch (err) {
        showAlert('Could not fetch details. Please check the URL.', true);
      } finally {
        document.getElementById('fetchDetailsBtn').innerHTML = '<i class="fa-solid fa-bolt"></i> Fetch Fast';
      }
    }

    async function triggerDownload(mode) {
      const url = mediaUrlInput.value.trim();
      const formatType = mode === 'video' ? document.getElementById('videoFormatSelect').value : document.getElementById('audioFormatSelect').value;
      const quality = mode === 'video' ? document.getElementById('videoQualitySelect').value : document.getElementById('audioQualitySelect').value;
      const title = mode === 'video' ? document.getElementById('videoFileName').value : document.getElementById('audioFileName').value;
      const btn = mode === 'video' ? document.getElementById('downloadVideoBtn') : document.getElementById('downloadAudioBtn');
      const oldHtml = btn.innerHTML;

      btn.innerHTML = '<i class="fa-solid fa-circle-notch spin-fast"></i> Starting...';
      try {
        const formData = new URLSearchParams({ url, mode, format_type: formatType, quality, custom_title: title });
        const res = await fetch(`${API_BASE}/api/prepare`, { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.download_url) {
            showAlert('<i class="fa-solid fa-check"></i> Download starting in Chrome!', false);
            // This triggers Chrome's native downloader cleanly via the Proxy URL
            window.location.href = data.download_url;
        }
      } catch (err) {
        showAlert('Download failed to start.', true);
      } finally {
        btn.innerHTML = oldHtml;
      }
    }
  </script>
</body>
</html>
